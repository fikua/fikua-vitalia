# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Clínica Vitalia in Authentik (2026.8). Synthetic data only.
#
# What it sets up, all by configuration:
#   - groups "Vitalia RRHH" (management area) and "Vitalia Médicos";
#   - the HR test account "rrhh" and five physicians. A physician's username
#     is their registration number, and their attributes hold what the
#     enrolment service needs (collegiate_number, administrative_number);
#   - two OIDC clients of Vitalia: "vitalia" for the management area (HR,
#     username and password) and "vitalia-profesional" for the physicians.
#     The physicians' one uses its own login flow, whose only option is
#     DoctorID, so Authentik sends them straight to the DoctorID IdP. Both
#     have a "doctorid" scope that puts the registration number in
#     personal_administrative_number, as DoctorID does;
#   - a SCIM 2.0 provider that sends the "Vitalia Médicos" group to the
#     enrolment service, with a mapping that adds the enrolment extension;
#   - the DoctorID identity provider (CGCOM Verifier) as an OIDC source on the
#     login page. A DoctorID sign-in is linked to the account whose username
#     is the presented registration number; there is no enrolment flow, so a
#     DoctorID that is not a physician of the clinic is refused.
#
# Values come from the container environment (deploy/authentik/.env).
version: 1
metadata:
  name: Clínica Vitalia
  labels:
    blueprints.goauthentik.io/description: Directory, SCIM provisioning and DoctorID federation of Clínica Vitalia
entries:
  # ------------------------------------------------------------ groups
  - model: authentik_core.group
    id: group-hr
    identifiers: {name: Vitalia RRHH}
  - model: authentik_core.group
    id: group-physicians
    identifiers: {name: Vitalia Médicos}

  # ------------------------------------------------------------- people
  - model: authentik_core.user
    identifiers: {username: rrhh}
    attrs:
      name: Marta Recursos Humanos
      email: rrhh@vitalia.example
      type: internal
      path: users/vitalia
      password: !Env VITALIA_HR_PASSWORD
      groups: [!KeyOf group-hr]

  # Physicians. Registration numbers ending in 0 already have a DoctorID in
  # the simulator; the others start the issuance from the portal.
  - model: authentik_core.user
    identifiers: {username: "282810010"}
    attrs: &physician
      name: Laia Puig Soler
      email: laia.puig@vitalia.example
      type: internal
      path: users/vitalia/medicos
      groups: [!KeyOf group-physicians]
      attributes:
        given_name: Laia
        family_name: Puig Soler
        collegiate_number: "282810010"
        administrative_number: 45123678R
        specialty: Pediatría
  - model: authentik_core.user
    identifiers: {username: "282810020"}
    attrs:
      <<: *physician
      name: Javier Ruiz Navarro
      email: javier.ruiz@vitalia.example
      attributes:
        given_name: Javier
        family_name: Ruiz Navarro
        collegiate_number: "282810020"
        administrative_number: 38291054X
        specialty: Cardiología
  - model: authentik_core.user
    identifiers: {username: "282810031"}
    attrs:
      <<: *physician
      name: Carmen Vidal Costa
      email: carmen.vidal@vitalia.example
      attributes:
        given_name: Carmen
        family_name: Vidal Costa
        collegiate_number: "282810031"
        administrative_number: 52746130T
        specialty: Medicina Familiar y Comunitaria
  - model: authentik_core.user
    identifiers: {username: "282810042"}
    attrs:
      <<: *physician
      name: Pau Sanz Moreno
      email: pau.sanz@vitalia.example
      attributes:
        given_name: Pau
        family_name: Sanz Moreno
        collegiate_number: "282810042"
        administrative_number: 47815392W
        specialty: Dermatología
  - model: authentik_core.user
    identifiers: {username: "282810053"}
    attrs:
      <<: *physician
      name: Lucía Martín López
      email: lucia.martin@vitalia.example
      attributes:
        given_name: Lucía
        family_name: Martín López
        collegiate_number: "282810053"
        administrative_number: 39602847K
        specialty: Traumatología

  # ------------------------------------------------ Vitalia (OIDC client)
  - model: authentik_providers_oauth2.scopemapping
    id: scope-doctorid
    identifiers: {name: "Vitalia: scope doctorid"}
    attrs:
      scope_name: doctorid
      description: Número de colegiado
      expression: |
        # The registration number, in the claim DoctorID v1 uses for it.
        return {"personal_administrative_number": ak_obj_attr(request.user, "collegiate_number")}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-vitalia
    identifiers: {name: Clínica Vitalia}
    attrs:
      client_type: confidential
      grant_types: [authorization_code]
      client_id: !Env [VITALIA_CLIENT_ID, vitalia]
      client_secret: !Env VITALIA_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/gestion/callback", !Env VITALIA_URL]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      property_mappings: &vitalia-scopes
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-doctorid

  # ------------------------------------- enrolment service (SCIM 2.0)
  - model: authentik_providers_scim.scimmapping
    id: scim-doctorid
    identifiers: {name: "Vitalia: SCIM extension DoctorID enrolment"}
    attrs:
      expression: |
        # Adds what the enrolment service needs to the SCIM User. Change
        # the attribute names here, not in code, if your directory keeps
        # them elsewhere.
        ext = "urn:eudistack:params:scim:schemas:extension:doctorid:1.0:User"
        return {
            "schemas": [ext],
            ext: {
                "collegiateNumber": ak_obj_attr(request.user, "collegiate_number"),
                "administrativeNumber": ak_obj_attr(request.user, "administrative_number"),
            },
        }

  - model: authentik_providers_scim.scimprovider
    id: provider-scim
    identifiers: {name: Servicio de enrolamiento DoctorID (SCIM)}
    attrs:
      url: !Env ENROLMENT_SCIM_URL
      auth_mode: token
      token: !Env ENROLMENT_SCIM_TOKEN
      compatibility_mode: default
      exclude_users_service_account: true
      group_filters: [!KeyOf group-physicians]
      property_mappings:
        - !Find [authentik_providers_scim.scimmapping, [managed, goauthentik.io/providers/scim/user]]
        - !KeyOf scim-doctorid
      property_mappings_group:
        - !Find [authentik_providers_scim.scimmapping, [managed, goauthentik.io/providers/scim/group]]

  - model: authentik_core.application
    identifiers: {slug: vitalia}
    attrs:
      name: Clínica Vitalia
      provider: !KeyOf provider-vitalia
      backchannel_providers: [!KeyOf provider-scim]
      meta_launch_url: !Env VITALIA_URL
      meta_description: Área profesional y gestión de profesionales
      policy_engine_mode: any

  # ------------------------------ DoctorID identity provider (CGCOM Verifier)
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    id: source-doctorid-mapping
    identifiers: {name: "DoctorID: enlazar por número de colegiado"}
    attrs:
      expression: |
        # The account to link is the one whose username is the presented
        # registration number. Nothing else is taken from the DoctorID.
        return {"username": info.get("personal_administrative_number")}

  - model: authentik_sources_oauth.oauthsource
    id: source-doctorid
    identifiers: {slug: doctorid}
    attrs:
      name: DoctorID
      provider_type: openidconnect
      enabled: true
      promoted: true
      consumer_key: !Env DOCTORID_CLIENT_ID
      consumer_secret: !Env DOCTORID_CLIENT_SECRET
      authorization_url: !Env DOCTORID_AUTHORIZE_URL
      access_token_url: !Env DOCTORID_TOKEN_URL
      oidc_jwks_url: !Env DOCTORID_JWKS_URL
      profile_url: ""
      additional_scopes: !Env [DOCTORID_SCOPES, doctorid]
      pkce: S256
      authorization_code_auth_method: post_body
      user_matching_mode: username_link
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: null
      user_property_mappings: [!KeyOf source-doctorid-mapping]

  # ------------------------------ physicians' sign-in (straight to DoctorID)
  # The physicians' login: DoctorID is the only option, so the login page
  # sends them to it without showing anything (no user fields, one source).
  - model: authentik_stages_identification.identificationstage
    id: stage-doctorid-only
    identifiers: {name: vitalia-doctorid-identification}
    attrs:
      user_fields: []
      sources: [!KeyOf source-doctorid]
      show_source_labels: true
      pretend_user_exists: false
  - model: authentik_flows.flow
    id: flow-doctorid
    identifiers: {slug: vitalia-doctorid}
    attrs:
      name: "Vitalia: acceso con DoctorID"
      title: Clínica Vitalia · Área profesional
      designation: authentication
      authentication: none
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-doctorid
      stage: !KeyOf stage-doctorid-only
      order: 10

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-vitalia-pro
    identifiers: {name: Clínica Vitalia · Área profesional}
    attrs:
      client_type: confidential
      grant_types: [authorization_code]
      client_id: !Env [VITALIA_PRO_CLIENT_ID, vitalia-profesional]
      client_secret: !Env VITALIA_PRO_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/profesional/callback", !Env VITALIA_URL]
      authentication_flow: !KeyOf flow-doctorid
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      property_mappings: *vitalia-scopes

  - model: authentik_core.application
    identifiers: {slug: vitalia-profesional}
    attrs:
      name: Clínica Vitalia · Área profesional
      provider: !KeyOf provider-vitalia-pro
      meta_launch_url: !Format ["%s/profesional", !Env VITALIA_URL]
      meta_description: Acceso de los médicos con DoctorID
      policy_engine_mode: any

  # The DoctorID button on the login page.
  - model: authentik_stages_identification.identificationstage
    identifiers: {name: default-authentication-identification}
    attrs:
      sources: [!KeyOf source-doctorid]
      show_source_labels: true

  # ------------------------------------------------ look and feel
  # Authentik's pages look like the clinic's: its logo, colours and font
  # (served by Vitalia; the font with CORS), light theme. The logo has the
  # clinic's name, so the flow titles say what the page is for.
  - model: authentik_flows.flow
    identifiers: {slug: default-authentication-flow}
    attrs:
      title: Acceso a la clínica
  - model: authentik_brands.brand
    identifiers: {domain: authentik-default}
    attrs:
      branding_title: Clínica Vitalia
      branding_logo: !Format ["%s/static/logo-vitalia.svg", !Env VITALIA_URL]
      branding_favicon: !Format ["%s/static/favicon.svg", !Env VITALIA_URL]
      branding_default_flow_background: !Format ["%s/static/auth-background.svg", !Env VITALIA_URL]
      attributes:
        settings:
          theme:
            base: light
      branding_custom_css: !Format
        - |
          @font-face {
            font-family: "Figtree"; font-style: normal; font-weight: 400 800; font-display: swap;
            src: url("%s/static/fonts/figtree-latin.woff2") format("woff2");
          }
          :root, :host {
            --pf-global--FontFamily--sans-serif: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
            --pf-global--FontFamily--heading--sans-serif: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
            --pf-global--FontFamily--redhat-updated--sans-serif: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
            --pf-global--FontFamily--redhat-updated--heading--sans-serif: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
            --pf-global--primary-color--100: #0b5fae;
            --pf-global--primary-color--200: #094f91;
            --pf-global--primary-color--dark-100: #094f91;
            --pf-global--link--Color: #0b5fae;
            --pf-global--link--Color--hover: #094f91;
            --pf-global--Color--100: #13233a;
            --pf-global--BorderRadius--sm: 10px;
            --pf-global--BorderRadius--lg: 14px;
          }
          @media (min-width: 768px) {
            ak-flow-executor::part(main) {
              border-radius: 18px;
              overflow: hidden;
              box-shadow: 0 2px 4px rgb(16 35 64 / .08), 0 18px 48px rgb(6 20 42 / .35);
            }
          }
        - !Env VITALIA_URL
