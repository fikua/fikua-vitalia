sonar.organization=fikua
sonar.projectKey=fikua_fikua-vitalia
sonar.projectName=fikua-vitalia

sonar.sources=.
sonar.exclusions=**/*_test.go,internal/store/storetest/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
# cmd/ only reads config and wires packages; the stubs and storetest are test support.
sonar.coverage.exclusions=cmd/**,internal/store/storetest/**,internal/adapterstub/**,internal/idpstub/**
sonar.go.tests.reportPaths=test-report.json
